name: Contribution snake

on:
  schedule:
    # a cada 6 horas (00:00, 06:00, 12:00 e 18:00 em Brasília), para o
    # contador de contribuições do README não ficar muito para trás
    - cron: "0 3,9,15,21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml", ".github/scripts/**"]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Gerar animações
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # paleta: preto, grafite, vinho e bordô
          outputs: |
            dist/github-snake.svg?color_snake=#781B32&color_dots=#EBEDF0,#F1CBD3,#D9909F,#B85269,#781B32
            dist/github-snake-dark.svg?color_snake=#F0F6FC&color_dots=#161B22,#321018,#541525,#781B32,#A52A45

      - name: Contar contribuições
        run: node .github/scripts/contribuicoes.mjs dist/contribuicoes.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USUARIO: ${{ github.repository_owner }}

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Atualiza animação de contribuições"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
